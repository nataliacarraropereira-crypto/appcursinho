[project]
name = "appcursinho"
version = "0.1.0"
description = "Sistema web para gestão de um cursinho preparatório para a UFSC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.39.0",
  "sqlalchemy>=2.0.36",
  "pymysql>=1.1.1",
  "python-dotenv>=1.0.1",
  "pandas>=2.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
